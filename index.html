<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Weekly Programme</title>
  <meta name="description" content="5-day calisthenics + flexibility programme tracker" />

  <!-- PWA / installable -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#080808" />

  <!-- iOS "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Programme" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #080808; }
    #root { min-height: 100vh; }
    /* simple loading state shown until React mounts */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #555;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"><div id="boot">Loading…</div></div>

  <!-- React + Babel from CDN (no build step needed) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- App code (JSX compiled in the browser by Babel) -->
  <script type="text/babel" data-presets="react" src="app.jsx"></script>

  <!-- Register the service worker so the app works offline / installs cleanly -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("SW registration failed", e);
        });
      });
    }
  </script>
</body>
</html>
